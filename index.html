<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A responsive todo app with light/dark themes and drag and drop reordering."
    />
    <meta name="color-scheme" content="light dark" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Todo app</title>

    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("todo-theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div class="hero" aria-hidden="true"></div>

    <main class="app">
      <header class="app__header">
        <h1 class="app__title">Todo</h1>

        <button
          class="theme-toggle"
          type="button"
          id="theme-toggle"
          aria-label="Switch to dark mode"
        >
          <img
            class="theme-toggle__icon theme-toggle__icon--moon"
            src="/images/icon-moon.svg"
            alt=""
            width="26"
            height="26"
          />
          <img
            class="theme-toggle__icon theme-toggle__icon--sun"
            src="/images/icon-sun.svg"
            alt=""
            width="26"
            height="26"
          />
        </button>
      </header>

      <form class="new-todo" id="new-todo-form" autocomplete="off">
        <span class="new-todo__circle" aria-hidden="true"></span>
        <label class="sr-only" for="new-todo-input">Create a new todo</label>
        <input
          class="new-todo__input"
          id="new-todo-input"
          name="todo"
          type="text"
          placeholder="Create a new todo…"
          maxlength="200"
          enterkeyhint="done"
        />
      </form>

      <section class="todo-card" aria-label="Todo list">
        <ul class="todo-list" id="todo-list"></ul>

        <div class="todo-footer">
          <p class="todo-footer__count" id="items-left" aria-live="polite">
            0 items left
          </p>

          <nav class="filters" aria-label="Filter todos">
            <button
              class="filters__btn is-active"
              type="button"
              data-filter="all"
              aria-pressed="true"
            >
              All
            </button>
            <button
              class="filters__btn"
              type="button"
              data-filter="active"
              aria-pressed="false"
            >
              Active
            </button>
            <button
              class="filters__btn"
              type="button"
              data-filter="completed"
              aria-pressed="false"
            >
              Completed
            </button>
          </nav>

          <button class="todo-footer__clear" type="button" id="clear-completed">
            Clear Completed
          </button>
        </div>
      </section>

      <p class="hint">Drag and drop to reorder list</p>
    </main>

    <footer class="attribution">
      Challenge by
      <a
        href="https://www.frontendmentor.io?ref=challenge"
        target="_blank"
        rel="noopener"
        >Frontend Mentor</a
      >. Coded by <a href="#">Mohamed Mostafa</a>.
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
